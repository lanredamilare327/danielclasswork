<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | My Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="index.html">My Website</a>
    <nav aria-label="Main navigation">
      <a href="index.html">About</a>
      <a href="contact.html" aria-current="page">Contact</a>
      <a href="achievements.html">Tech Achievements</a>
    </nav>
  </header>

  <main>
    <section class="page-heading">
      <h1>Contact Me</h1>
      <p>Have a question? You can fill out this form.</p>
    </section>

    <form class="contact-form" action="#" method="get">
      <label for="name">Your name</label>
      <input type="text" id="name" name="name" placeholder="Type your name">

      <label for="email">Your email</label>
      <input type="email" id="email" name="email" placeholder="name@example.com">

      <label for="message">Your message</label>
      <textarea id="message" name="message" rows="5" placeholder="Write a message"></textarea>

      <button type="submit">Send message</button>
    </form>
  </main>

  <footer>
    <p>Thanks for visiting my website.</p>
  </footer>
</body>
</html>
